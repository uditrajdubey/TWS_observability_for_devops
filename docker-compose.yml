services:
  prometheus:
    image: prom/prometheus:latest  # name of the prometheus image 
    container_name: prometheus  # name of the docker container
    volumes:
      - ./prometheus:/etc/prometheus  # we are connecting here cuurent folder prometheus to a prometheus folder in which prometheus config file is stored(i.e prometheus.yml)
      - prometheus_data:/prometheus  # this prometheus data is a type of named volume in docker container
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"  # we have to create the promehteus.yml isnside the prometheus folder 
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - monitoring
    restart: always # it means if docker re-starts it will always automatically starts 

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)"
    ports:
      - "9100:9100"
    networks:
      - monitoring
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - monitoring
    restart: always


  # --- Logs ---
  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    networks:
      - monitoring
    restart: always    
    
   # --- OpenTelemetry Collector: receives all telemetry, routes it to the right backend ---

   
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    expose:
      - 8889          # app metrics (Prometheus scrapes here)
      - 8888          # the Collector's own metrics (Prometheus scrapes here)
    depends_on:
      - loki
    networks:
      - monitoring
    restart: always

networks:
  monitoring:
volumes:
  prometheus_data:
